name: Deploy Mona Lisa Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify images are real JPEG files (not Git LFS pointers)
        run: |
          for f in public/mona-lisa.jpg public/leonardo.jpg; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 10000 ] || head -c 20 "$f" | grep -q "version https"; then
              echo "::error::$f looks like an LFS pointer or is missing ($size bytes)"; exit 1
            fi
            echo "$f OK ($size bytes)"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
